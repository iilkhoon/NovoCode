<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Sayt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
    <script>
      // NovoCode: runtime xətalarını studioya ötürür ki, AI özü düzəltsin.
      (function () {
        function send(message, stack) {
          try { parent.postMessage({ source: "novo-preview", type: "error", message: String(message), stack: String(stack || "") }, "*"); } catch (e) {}
        }
        window.addEventListener("error", function (e) { send(e.message, e.error && e.error.stack); });
        window.addEventListener("unhandledrejection", function (e) { send(e.reason && e.reason.message || e.reason, e.reason && e.reason.stack); });
        var ce = console.error;
        console.error = function () { send(Array.prototype.join.call(arguments, " ")); ce.apply(console, arguments); };
        window.addEventListener("load", function () { parent.postMessage({ source: "novo-preview", type: "ready" }, "*"); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <a id="novo-badge" href="https://novocode.az" target="_blank" rel="noopener" style="position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:12px;background:#fff;color:#0b0b12;font:600 12.5px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px -8px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.06)">
      <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="nvb" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4f8bff"/><stop offset=".5" stop-color="#6447ff"/><stop offset="1" stop-color="#c04cfd"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="19" fill="url(#nvb)"/><g transform="translate(7 7) scale(.78)"><path d="M17 46V30a10.5 10.5 0 0 1 21 0v16" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/><rect x="44.5" y="37" width="7.5" height="9.5" rx="1.6" fill="#fff"/></g></svg>
      Made with Novo
      <button type="button" aria-label="Bağla" onclick="event.preventDefault();this.parentNode.remove()" style="margin-left:2px;border:0;background:transparent;color:#80808d;font-size:14px;line-height:1;cursor:pointer;padding:2px 4px">×</button>
    </a>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
